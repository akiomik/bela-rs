[package]
name = "bela"
description = "Safe Rust API for real-time audio on Bela Gem"
readme = "README.md"
documentation = "https://docs.rs/bela"
# Not this crate's own native library — bela-sys already claims
# "bela" for that. This publishes device link arguments to bela's own
# dependents, relaying what bela-sys publishes to its immediate
# dependent, bela, since `links` metadata does not reach past one
# level. See build.rs, link_args.rs and docs/cross-compile.md.
#
# A published `links` name is a compatibility constraint: only one
# version of a crate carrying it may appear in a dependency graph.
links = "bela_relay"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

# docs.rs builds for x86_64-linux by default, which would hide the
# device-only API behind the bela_device cfg.
[package.metadata.docs.rs]
default-target = "aarch64-unknown-linux-gnu"
targets = ["aarch64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies]
bela-sys = { path = "../bela-sys", version = "0.6.0" }

# Same condition as the `bela_device` cfg emitted by build.rs.
[target.'cfg(all(target_arch = "aarch64", target_os = "linux"))'.dependencies]
libc = "0.2"
