[package]
name = "bela"
description = "Safe Rust API for real-time audio on Bela Gem"
readme = "README.md"
documentation = "https://docs.rs/bela"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

# docs.rs builds for x86_64-linux by default, which would hide the
# device-only API behind the bela_device cfg.
[package.metadata.docs.rs]
default-target = "aarch64-unknown-linux-gnu"
targets = ["aarch64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies]
bela-sys = { path = "../bela-sys", version = "0.4.0" }

# Same condition as the `bela_device` cfg emitted by build.rs.
[target.'cfg(all(target_arch = "aarch64", target_os = "linux"))'.dependencies]
libc = "0.2"
