# Codecov configuration.
# Reference: https://docs.codecov.com/docs/codecovyml-reference

coverage:
  status:
    project:
      default:
        target: auto
        # Moving code around shifts the ratio slightly; only a real drop
        # should turn the check red.
        threshold: 1%
    patch:
      default:
        target: 80%

comment:
  layout: condensed_header, diff, files
  require_changes: true

ignore:
  # Generated by `cargo xtask bindgen` from the vendored headers: FFI
  # declarations that describe libbela rather than code this project
  # tests, and unreachable on the host in any case.
  - bela-sys/src/bindings.rs
