name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, lint and test (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the pinned toolchain from rust-toolchain.toml, including
      # its declared targets and components, and caches the build.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  coverage:
    name: Coverage (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Host coverage only, like the test job: the device-only code behind
      # the `bela_device` cfg is not compiled here, so it contributes no
      # lines to the report rather than counting as uncovered.
      #
      # xtask is excluded: it is a repository task, not shipped code, and
      # most of it drives ssh and scp against a board, which no host run
      # can reach. Measuring it would report the coverage of the library
      # as lower without saying anything about the library.
      - run: cargo llvm-cov --workspace --exclude xtask --lcov --output-path lcov.info
      # The upload runs in its own job so that `id-token: write` reaches
      # only the actions that need it. This job runs
      # `taiki-e/install-action` and `Swatinem/rust-cache`, which are
      # maintained by individuals, and any action in a job holding that
      # permission can request an OIDC token.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 1

  coverage-upload:
    name: Upload coverage (host)
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Codecov maps the report's paths onto the files tracked in the
      # checkout.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: lcov
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: lcov.info
          # A pull request from a fork cannot get an OIDC token, so its
          # upload goes without one, which Codecov may refuse. Failing on
          # that would fail a fork's pull request for a reason outside
          # its control.
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  clippy-aarch64:
    name: Clippy (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      # clippy subsumes `cargo check` and does not link, so no sysroot or
      # cross-linker is needed. This also lints the device-only code
      # (`bela_device` cfg) that the host job never compiles.
      #
      # xtask is excluded: it runs on the development machine, never on a
      # board, so cross-compiling it says nothing. The host job lints it.
      - run: cargo clippy --workspace --exclude xtask --all-targets --target aarch64-unknown-linux-gnu -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      # Documented for the device target: it includes the device-only API
      # (`bela_device` cfg) that crate-level intra-doc links point to,
      # which would be unresolved on a host-target doc build. xtask is
      # excluded for the same reason as in the aarch64 clippy job.
      - run: cargo doc --workspace --exclude xtask --no-deps --target aarch64-unknown-linux-gnu
        env:
          RUSTDOCFLAGS: -D warnings
      # Doc tests execute on the host (device binaries cannot run in CI).
      - run: cargo test --workspace --doc

  msrv:
    name: Check MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Single source of truth for the MSRV: the workspace rust-version
      # in Cargo.toml.
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      # RUSTUP_TOOLCHAIN outranks rust-toolchain.toml, which would
      # otherwise re-pin to the development toolchain.
      #
      # xtask is excluded: the MSRV is a promise to the crates' users,
      # and they never build a repository task. clap tracks a recent
      # MSRV of its own within its 4.x line (1.60 to 1.85 so far), so
      # including it would let that schedule fail a job about this
      # project's compatibility. Contributors build xtask with the
      # pinned toolchain from rust-toolchain.toml.
      - run: cargo check --workspace --exclude xtask --all-targets
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
