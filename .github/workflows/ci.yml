name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, lint and test (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  clippy-aarch64:
    name: Clippy (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # clippy subsumes `cargo check` and does not link, so no sysroot or
      # cross-linker is needed. This also lints the device-only code
      # (`bela_device` cfg) that the host job never compiles.
      - run: cargo clippy --workspace --all-targets --target aarch64-unknown-linux-gnu -- -D warnings
