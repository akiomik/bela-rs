name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      # Required for crates.io Trusted Publishing (OIDC).
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Check that the tag matches the workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          if [ "$tag" != "$version" ]; then
            echo "tag v${tag} does not match workspace version ${version}" >&2
            exit 1
          fi
      # Exchanges the workflow's OIDC token for a short-lived crates.io
      # token. Requires Trusted Publishing to be configured for both
      # crates on crates.io (Settings -> Trusted Publishing).
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish bela-sys, then bela
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # Versions already on crates.io are skipped so the workflow can
        # be re-run safely. The check uses the sparse index because the
        # api/v1 endpoints reject non-browser user agents (403). The
        # retry loop absorbs the index-propagation delay between
        # publishing bela-sys and publishing bela.
        run: |
          for crate in bela-sys bela; do
            version="$(cargo metadata --no-deps --format-version 1 \
              | jq -r ".packages[] | select(.name == \"${crate}\") | .version")"
            prefix="${crate:0:2}/${crate:2:2}"
            if curl -sf "https://index.crates.io/${prefix}/${crate}" \
              | grep -q "\"vers\":\"${version}\""; then
              echo "${crate}@${version} is already on crates.io, skipping"
              continue
            fi
            n=0
            until cargo publish -p "${crate}"; do
              n=$((n + 1))
              if [ "$n" -ge 5 ]; then
                exit 1
              fi
              echo "publishing ${crate} failed (attempt ${n}), retrying in 30s..."
              sleep 30
            done
          done
