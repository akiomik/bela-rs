[package]
name = "bela-sys"
description = "Raw FFI bindings to the Bela core API (libbela) for Bela Gem"
readme = "README.md"
documentation = "https://docs.rs/bela-sys"
links = "bela"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["external-ffi-bindings", "embedded", "multimedia::audio"]

# Match the primary target; the bindings are generated for aarch64.
[package.metadata.docs.rs]
default-target = "aarch64-unknown-linux-gnu"
targets = ["aarch64-unknown-linux-gnu"]

[lints]
workspace = true

[build-dependencies]
# Compiles shim/midi.cpp on device targets. bindgen is not here: the
# bindings are generated by `cargo xtask bindgen` and committed, so no
# build of this crate needs libclang.
cc = "1.2"
