[alias]
xtask = "run --manifest-path xtask/Cargo.toml --"

# Cross-compilation settings for Bela Gem (PocketBeagle 2, aarch64).
#
# The linker comes from the messense/macos-cross-toolchains Homebrew tap
# (see docs/cross-compile.md). Only needed when actually linking device
# binaries; `cargo check`/`clippy` for the target work without it.
# Link flags and library search paths are emitted by bela-sys/build.rs
# based on the BELA_SYSROOT environment variable.
[target.aarch64-unknown-linux-gnu]
linker = "scripts/aarch64-bela-linker.sh"
