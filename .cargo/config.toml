[alias]
xtask = "run --package xtask --"

# Cross-compilation settings for Bela Gem (PocketBeagle 2, aarch64).
#
# The wrapper calls the compiler named by BELA_CC, which defaults to the
# macOS tap's name and has to be installed (see docs/cross-compile.md).
# Only needed when actually linking device binaries; for the target,
# `cargo check`/`clippy` work without it. Link flags and library search
# paths are emitted by bela-sys/build.rs based on the BELA_SYSROOT
# environment variable.
[target.aarch64-unknown-linux-gnu]
linker = "scripts/aarch64-bela-linker.sh"
