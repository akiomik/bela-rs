# Pinned so that a moving `stable` cannot break local or CI builds;
# upgrades are deliberate edits to this file. The MSRV lives separately
# in the workspace `rust-version` and is verified by its own CI job.
[toolchain]
channel = "1.91.1"
targets = ["aarch64-unknown-linux-gnu"]
# llvm-tools-preview provides the profdata/cov tooling `cargo llvm-cov`
# drives, so coverage runs the same way locally and in CI.
components = ["rustfmt", "clippy", "llvm-tools-preview"]
