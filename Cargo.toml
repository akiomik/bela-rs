[workspace]
resolver = "3"
members = ["bela-sys", "bela"]
# xtask is a standalone package (not a member) so that bindgen and its
# libclang requirement stay out of ordinary builds. Run it via `cargo xtask`.
exclude = ["xtask"]

# Device binaries must not unwind across the audio callback boundary; abort
# is what would happen anyway, and this avoids shipping unwinding machinery.
[profile.release]
panic = "abort"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/akiomik/bela-rs"
keywords = ["bela", "audio", "embedded", "realtime", "dsp"]
categories = ["embedded", "multimedia::audio"]
